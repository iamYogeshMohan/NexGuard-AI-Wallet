version: '3.8'

services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexguard
      POSTGRES_PASSWORD: nexguard_password_2024
      POSTGRES_DB: nexguard_wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexguard -d nexguard_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend & 10 AI Agents Engine ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nexguard:nexguard_password_2024@postgres:5432/nexguard_wallet
      ENVIRONMENT: production
      APP_NAME: "NexGuard Secure Wallet"
      SECRET_KEY: "nexguard-production-super-secret-key-32chars"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── Next.js Frontend (Mobile Wallet & Bank SOC) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/soc
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
